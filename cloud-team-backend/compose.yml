services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ctm-api
    restart: unless-stopped
    ports:
      - '127.0.0.1:${PORT:-3000}:${PORT:-3000}'
    environment:
      PORT: ${PORT:-3000}
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@${CONTAINER_POSTGRES_HOST:-ctm-postgres}:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-ctm}
      SESSION_SECRET: ${SESSION_SECRET}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:5173,https://localhost}
      LOGIN_RATE_LIMIT_MAX: ${LOGIN_RATE_LIMIT_MAX:-10}
      LOGIN_RATE_LIMIT_WINDOW_MINUTES: ${LOGIN_RATE_LIMIT_WINDOW_MINUTES:-15}
      JSON_BODY_LIMIT: ${JSON_BODY_LIMIT:-256kb}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ATTACHMENTS_DIR: /attachments
      MAX_ATTACHMENT_BYTES: ${MAX_ATTACHMENT_BYTES:-26214400}
      MAX_COPILOT_FILE_BYTES: ${MAX_COPILOT_FILE_BYTES:-15728640}
      NODE_ENV: production
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.8-flash}
      COPILOT_SNAPSHOT_BUDGET: ${COPILOT_SNAPSHOT_BUDGET:-1000000}
    volumes:
      - ./attachments:/attachments
    networks:
      default:
        aliases:
          - api
          - ctm-api
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20

networks:
  default:
    name: ctm-network
    external: true
